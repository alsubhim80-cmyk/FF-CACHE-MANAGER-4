name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install lief

    - name: Run Build Script
      run: |
        # البحث عن ملف السكربت الرئيسي وتشغيله عبر PowerShell Core (pwsh)
        SCRIPT_PATH=$(find . -name "BUILD-FF-CACHE-MANAGER.ps1" | head -n 1)
        if [ -z "$SCRIPT_PATH" ]; then
          echo "Could not find BUILD-FF-CACHE-MANAGER.ps1"
          exit 1
        fi
        SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
        cd "$SCRIPT_DIR"
        
        # تشغيل السكربت
        pwsh ./BUILD-FF-CACHE-MANAGER.ps1

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
