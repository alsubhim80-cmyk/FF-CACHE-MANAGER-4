name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies & LLVM
      run: |
        python -m pip install --upgrade pip
        pip install lief
        choco install llvm -y

    - name: Setup Tools & Build
      shell: powershell
      run: |
        # 1. تحديد مكان iPhoneOS.sdk في المستودع
        $sdkDir = Get-ChildItem -Recurse -Directory -Filter "iPhoneOS.sdk" | Select-Object -First 1
        if (-not $sdkDir) {
            Write-Error "Could not find iPhoneOS.sdk"
            exit 1
        }
        $sdkPath = $sdkDir.FullName
        Write-Host "SDK Location: $sdkPath"

        # 2. تجهيز أدوات LLVM ونقلها لمجلدات Tools
        $foundLipo = Get-ChildItem -Path "C:\" -Filter "llvm-lipo.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $foundAr = Get-ChildItem -Path "C:\" -Filter "llvm-ar.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $foundObjcopy = Get-ChildItem -Path "C:\" -Filter "llvm-objcopy.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

        $lipoSrc = if ($foundLipo) { $foundLipo.FullName } else { $foundAr.FullName }
        $installNameSrc = if ($foundObjcopy) { $foundObjcopy.FullName } else { $foundAr.FullName }

        $mainScript = Get-ChildItem -Recurse -Filter "BUILD-FF-CACHE-MANAGER.ps1" | Select-Object -First 1
        if (-not $mainScript) {
            Write-Error "Could not find BUILD-FF-CACHE-MANAGER.ps1"
            exit 1
        }

        $possibleToolDirs = @(
            (Join-Path $mainScript.DirectoryName "app\ff_manager\tools"),
            (Join-Path $mainScript.DirectoryName "app\tools"),
            (Join-Path $mainScript.DirectoryName "tools")
        )

        foreach ($dir in $possibleToolDirs) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            if ($lipoSrc) { Copy-Item $lipoSrc -Destination (Join-Path $dir "llvm-lipo.exe") -Force }
            if ($installNameSrc) { Copy-Item $installNameSrc -Destination (Join-Path $dir "llvm-install-name-tool.exe") -Force }
            $env:PATH = "$dir;$env:PATH"
        }

        # 3. إنشاء Wrapper لـ Clang يضيف -isysroot توماتيكياً
        $realClang = Get-Command clang.exe -ErrorAction SilentlyContinue
        if (-not $realClang) {
            $realClang = Get-ChildItem -Path "C:\" -Filter "clang.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        }

        if ($realClang) {
            $wrapperDir = "C:\clang_wrapper"
            New-Item -ItemType Directory -Force -Path $wrapperDir | Out-Null
            $cmdContent = "@echo off`n`"$($realClang.FullName)`" -isysroot `"$sdkPath`" %*"
            Set-Content -Path (Join-Path $wrapperDir "clang.bat") -Value $cmdContent
            Set-Content -Path (Join-Path $wrapperDir "clang.cmd") -Value $cmdContent
            $env:PATH = "$wrapperDir;$env:PATH"
        }

        # 4. التعديل المباشر داخل ملف build.ps1 لتمرير -isysroot
        $innerBuildScript = Get-ChildItem -Recurse -Filter "build.ps1" | Where-Object { $_.DirectoryName -like "*ff_manager*" } | Select-Object -First 1
        if ($innerBuildScript) {
            $content = Get-Content $innerBuildScript.FullName -Raw
            if ($content -notmatch "-isysroot") {
                $content = $content -replace 'clang(\.exe)?', "clang -isysroot `"$sdkPath`""
                Set-Content -Path $innerBuildScript.FullName -Value $content
                Write-Host "Successfully patched build.ps1 with -isysroot"
            }
        }

        # 5. تشغيل سكربت البناء
        Set-Location $mainScript.DirectoryName
        Write-Host "Executing Build Script in: $($mainScript.DirectoryName)"
        & .\BUILD-FF-CACHE-MANAGER.ps1

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
