name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies & LLVM
      run: |
        python -m pip install --upgrade pip
        pip install lief
        choco install llvm -y

    - name: Setup Tools & Build
      shell: powershell
      run: |
        # 1. البحث عن أدوات LLVM وتجهيز البيئة
        $foundLipo = Get-ChildItem -Path "C:\" -Filter "llvm-lipo.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $foundAr = Get-ChildItem -Path "C:\" -Filter "llvm-ar.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $foundObjcopy = Get-ChildItem -Path "C:\" -Filter "llvm-objcopy.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

        $lipoSrc = if ($foundLipo) { $foundLipo.FullName } else { $foundAr.FullName }
        $installNameSrc = if ($foundObjcopy) { $foundObjcopy.FullName } else { $foundAr.FullName }

        if ($foundLipo) {
            $env:PATH = "$($foundLipo.DirectoryName);$env:PATH"
        }

        # 2. تحديد سكريبت البناء ومجلدات الأدوات
        $script = Get-ChildItem -Recurse -Filter "BUILD-FF-CACHE-MANAGER.ps1" | Select-Object -First 1
        if (-not $script) {
            Write-Error "Could not find BUILD-FF-CACHE-MANAGER.ps1"
            exit 1
        }

        $possibleToolDirs = @(
            (Join-Path $script.DirectoryName "app\ff_manager\tools"),
            (Join-Path $script.DirectoryName "app\tools"),
            (Join-Path $script.DirectoryName "tools")
        )

        foreach ($dir in $possibleToolDirs) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            if ($lipoSrc) { Copy-Item $lipoSrc -Destination (Join-Path $dir "llvm-lipo.exe") -Force }
            if ($installNameSrc) { Copy-Item $installNameSrc -Destination (Join-Path $dir "llvm-install-name-tool.exe") -Force }
            $env:PATH = "$dir;$env:PATH"
        }

        # 3. تحديد مسار iPhoneOS.sdk وتمريره للمترجم عبر CFLAGS و -isysroot
        $sdkDir = Get-ChildItem -Recurse -Directory -Filter "iPhoneOS.sdk" | Select-Object -First 1
        if ($sdkDir) {
            $sdkPath = $sdkDir.FullName
            Write-Host "Configuring Clang Flags with SDK Path: $sdkPath"
            
            $env:SDKROOT = $sdkPath
            $env:IOS_SDK = $sdkPath
            
            # إجبار Clang على قراءة مجلدات النظام داخل iPhoneOS.sdk
            $sysrootFlag = "-isysroot `"$sdkPath`""
            $env:CFLAGS = "$sysrootFlag"
            $env:CXXFLAGS = "$sysrootFlag"
            $env:OBJCFLAGS = "$sysrootFlag"
        }

        # 4. تشغيل سكريبت البناء
        Set-Location $script.DirectoryName
        Write-Host "Executing Build Script in: $($script.DirectoryName)"
        
        if ($sdkDir) {
            & .\BUILD-FF-CACHE-MANAGER.ps1 -IosSdk "$($sdkDir.FullName)"
        } else {
            & .\BUILD-FF-CACHE-MANAGER.ps1
        }

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
