name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install LLVM
      run: |
        choco install llvm -y

    - name: Setup Tools & Build
      shell: powershell
      run: |
        # 1. البحث عن أدوات LLVM في كامل النظام
        $foundLipo = Get-ChildItem -Path "C:\" -Filter "llvm-lipo.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $foundAr = Get-ChildItem -Path "C:\" -Filter "llvm-ar.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $foundObjcopy = Get-ChildItem -Path "C:\" -Filter "llvm-objcopy.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

        # 2. تحديد الملفات المصدرية للأدوات
        $lipoSrc = if ($foundLipo) { $foundLipo.FullName } else { $foundAr.FullName }
        $installNameSrc = if ($foundObjcopy) { $foundObjcopy.FullName } else { $foundAr.FullName }

        Write-Host "Lipo Source: $lipoSrc"
        Write-Host "Install-Name-Tool Source: $installNameSrc"

        # 3. العثور على جميع المجلدات المسماة tools أو app داخل المستودع ونسخ الأدوات إليها
        $targetDirs = Get-ChildItem -Recurse -Directory -Filter "tools" | Select-Object -ExpandProperty FullName
        
        # إضافة المجلد الافتراضي المتوقع من السكربت
        $script = Get-ChildItem -Recurse -Filter "BUILD-FF-CACHE-MANAGER.ps1" | Select-Object -First 1
        if ($script) {
            $defaultTools = Join-Path $script.DirectoryName "app\ff_manager\tools"
            New-Item -ItemType Directory -Force -Path $defaultTools | Out-Null
            $targetDirs += $defaultTools
        }

        foreach ($dir in ($targetDirs | Select-Object -Unique)) {
            Write-Host "Populating tools into: $dir"
            if ($lipoSrc) { Copy-Item $lipoSrc -Destination (Join-Path $dir "llvm-lipo.exe") -Force }
            if ($installNameSrc) { Copy-Item $installNameSrc -Destination (Join-Path $dir "llvm-install-name-tool.exe") -Force }
        }

        # 4. تشغيل سكربت البناء
        if ($script) {
            Set-Location $script.DirectoryName
            Write-Host "Executing Build Script in: $($script.DirectoryName)"
            & .\BUILD-FF-CACHE-MANAGER.ps1
        } else {
            Write-Error "Could not find BUILD-FF-CACHE-MANAGER.ps1"
            exit 1
        }

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
