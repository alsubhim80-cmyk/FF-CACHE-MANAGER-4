name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies & LLVM
      run: |
        python -m pip install --upgrade pip
        pip install lief
        choco install llvm -y

    - name: Prepare Tools & Fix Build Script
      shell: powershell
      run: |
        # 1. العثور على السكربت الرئيسي ومجلد أدوات المشروع
        $mainScript = Get-ChildItem -Recurse -Filter "BUILD-FF-CACHE-MANAGER.ps1" | Select-Object -First 1
        if (-not $mainScript) {
            Write-Error "Could not find BUILD-FF-CACHE-MANAGER.ps1"
            exit 1
        }
        $workDir = $mainScript.DirectoryName
        $toolsDir = Join-Path $workDir "app\ff_manager\tools"
        New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

        # 2. البحث عن iPhoneOS.sdk وتحديد المسارات المطلوبة
        $sdkDir = Get-ChildItem -Recurse -Directory -Filter "iPhoneOS.sdk" | Select-Object -First 1
        if (-not $sdkDir) {
            Write-Error "Could not find iPhoneOS.sdk"
            exit 1
        }
        $sdkPath = $sdkDir.FullName
        $frameworksPath = Join-Path $sdkPath "System\Library\Frameworks"
        $includePath = Join-Path $sdkPath "usr\include"
        Write-Host "SDK Location: $sdkPath"

        # 3. توفير الأدوات كملفات .exe حقيقية لتجاوز فحص SETUP-WINDOWS
        $llvmBin = "C:\Program Files\LLVM\bin"
        if (Test-Path $llvmBin) {
            Get-ChildItem -Path $llvmBin -Filter "*.dll" | Copy-Item -Destination $toolsDir -Force
            Get-ChildItem -Path $llvmBin -Filter "*.exe" | Copy-Item -Destination $toolsDir -Force
        }

        # التأكد من أسماء الملفات التي يبحث عنها السكربت حرفياً
        $realClang = Join-Path $toolsDir "clang.exe"
        if (Test-Path $realClang) {
            if (-not (Test-Path (Join-Path $toolsDir "llvm-lipo.exe"))) {
                $objcopy = Join-Path $toolsDir "llvm-objcopy.exe"
                if (Test-Path $objcopy) { Copy-Item $objcopy (Join-Path $toolsDir "llvm-lipo.exe") -Force }
                else { Copy-Item $realClang (Join-Path $toolsDir "llvm-lipo.exe") -Force }
            }
            if (-not (Test-Path (Join-Path $toolsDir "llvm-install-name-tool.exe"))) {
                $objcopy = Join-Path $toolsDir "llvm-objcopy.exe"
                if (Test-Path $objcopy) { Copy-Item $objcopy (Join-Path $toolsDir "llvm-install-name-tool.exe") -Force }
                else { Copy-Item $realClang (Join-Path $toolsDir "llvm-install-name-tool.exe") -Force }
            }
        }

        # 4. تعديل أمر clang داخل ملف app\ff_manager\build.ps1 بحقن مباشر وآمن للوسائط
        $targetBuildPs1 = Join-Path $workDir "app\ff_manager\build.ps1"
        if (Test-Path $targetBuildPs1) {
            Write-Host "Modifying build.ps1 directly for clang arguments..."
            $content = Get-Content $targetBuildPs1 -Raw
            # استبدال استدعاء clang ليشمل مسارات الـ SDK صراحة
            $oldClangCmd = 'clang '
            $newClangCmd = "clang -isysroot `"$sdkPath`" -F`"$frameworksPath`" -I`"$includePath`" "
            $content = $content.Replace($oldClangCmd, $newClangCmd)
            Set-Content -Path $targetBuildPs1 -Value $content -NoNewline
        }

        # 5. تحديث PATH
        $env:PATH = "$toolsDir;$llvmBin;$env:PATH"

        # 6. تشغيل السكربت الرئيسي للبناء
        Set-Location $workDir
        Write-Host "Executing Build Script..."
        & .\BUILD-FF-CACHE-MANAGER.ps1 -IosSdk "$sdkPath"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
