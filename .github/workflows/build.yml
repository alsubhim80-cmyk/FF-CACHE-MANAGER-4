name: Clean iOS IPA Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lief

    - name: Run Build Script
      run: |
        # البحث عن السكربت الرئيسي وتشغيله مباشرة في بيئة ماك الرسمية
        BUILD_SCRIPT=$(find . -name "BUILD-FF-CACHE-MANAGER.ps1" | head -n 1)
        if [ -n "$BUILD_SCRIPT" ]; then
          pwsh "$BUILD_SCRIPT"
        else
          echo "Main build script not found!"
          exit 1
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
