name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies & LLVM
      run: |
        python -m pip install --upgrade pip
        pip install lief
        choco install llvm -y

    - name: Prepare Wrapper & Run Build
      shell: powershell
      run: |
        # 1. تحديد مكان السكربت الرئيسي ومجلد أدوات المشروع
        $mainScript = Get-ChildItem -Recurse -Filter "BUILD-FF-CACHE-MANAGER.ps1" | Select-Object -First 1
        if (-not $mainScript) {
            Write-Error "Could not find BUILD-FF-CACHE-MANAGER.ps1"
            exit 1
        }
        $workDir = $mainScript.DirectoryName
        $toolsDir = Join-Path $workDir "app\ff_manager\tools"
        New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

        # 2. العثور على iPhoneOS.sdk وتحديد المسارات المطلوبة
        $sdkDir = Get-ChildItem -Recurse -Directory -Filter "iPhoneOS.sdk" | Select-Object -First 1
        if (-not $sdkDir) {
            Write-Error "Could not find iPhoneOS.sdk"
            exit 1
        }
        $sdkPath = $sdkDir.FullName
        $frameworksPath = Join-Path $sdkPath "System\Library\Frameworks"
        $includePath = Join-Path $sdkPath "usr\include"
        Write-Host "SDK Location: $sdkPath"

        # 3. العثور على clang.exe الأصلي المثبت في النظام
        $realClang = (Get-Command "C:\Program Files\LLVM\bin\clang.exe" -ErrorAction SilentlyContinue).Path
        if (-not $realClang) {
            $realClang = (Get-Command clang.exe).Path
        }
        Write-Host "Real Clang Location: $realClang"

        # 4. نسخ أدوات LLVM المساعدة لضمان وجود [OK] في فحص البيئة
        $llvmBin = "C:\Program Files\LLVM\bin"
        if (Test-Path $llvmBin) {
            Get-ChildItem -Path $llvmBin -Filter "*.dll" | Copy-Item -Destination $toolsDir -Force
            Get-ChildItem -Path $llvmBin -Filter "*.exe" | Copy-Item -Destination $toolsDir -Force
        }

        # 5. إنشاء Clang Wrapper (أداة مخصصة بنفس اسم clang.exe) تقوم بحقن وسائط UIKit تلقائياً
        $wrapperCmdPath = Join-Path $toolsDir "clang.cmd"
        $cmdContent = "@echo off`n`"$realClang`" -isysroot `"$sdkPath`" -F`"$frameworksPath`" -I`"$includePath`" %*"
        Set-Content -Path $wrapperCmdPath -Value $cmdContent -Encoding ASCII

        # تحويل الـ cmd إلى exe خفيف أو توجيه الاستدعاء
        Copy-Item $realClang -Destination (Join-Path $toolsDir "clang_real.exe") -Force

        # إنشاء سكربت PowerShell بديل لـ clang.exe لضمان تنفيذ الحقن تلقائياً
        $psWrapper = Join-Path $toolsDir "clang.bat"
        $batContent = "@echo off`n`"$realClang`" -isysroot `"$sdkPath`" -F`"$frameworksPath`" -I`"$includePath`" %*"
        Set-Content -Path $psWrapper -Value $batContent -Encoding ASCII

        # 6. إضافة مجلد الأدوات لأول الـ PATH
        $env:PATH = "$toolsDir;$llvmBin;$env:PATH"

        # 7. تشغيل السكربت الرئيسي للبناء
        Set-Location $workDir
        Write-Host "Executing Build Script..."
        & .\BUILD-FF-CACHE-MANAGER.ps1 -IosSdk "$sdkPath"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
