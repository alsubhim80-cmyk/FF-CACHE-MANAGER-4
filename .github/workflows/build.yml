name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies & LLVM
      run: |
        python -m pip install --upgrade pip
        pip install lief
        choco install llvm -y

    - name: Setup Tools & Build
      shell: powershell
      run: |
        # 1. إضافة مسار LLVM الرئيسي إلى PATH
        $llvmBin = "C:\Program Files\LLVM\bin"
        if (Test-Path $llvmBin) {
            $env:PATH = "$llvmBin;$env:PATH"
        }

        # 2. تحديد مسار iPhoneOS.sdk
        $sdkDir = Get-ChildItem -Recurse -Directory -Filter "iPhoneOS.sdk" | Select-Object -First 1
        if (-not $sdkDir) {
            Write-Error "Could not find iPhoneOS.sdk"
            exit 1
        }
        $sdkPath = $sdkDir.FullName
        Write-Host "SDK Location: $sdkPath"

        # 3. جلب ملفات LLVM المصدرية
        $foundLipo = Get-ChildItem -Path "C:\" -Filter "llvm-lipo.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $foundInstallName = Get-ChildItem -Path "C:\" -Filter "llvm-install-name-tool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $foundAr = Get-ChildItem -Path "C:\" -Filter "llvm-ar.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $foundObjcopy = Get-ChildItem -Path "C:\" -Filter "llvm-objcopy.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

        $lipoSrc = if ($foundLipo) { $foundLipo } else { $foundAr }
        $installNameSrc = if ($foundInstallName) { $foundInstallName } else { if ($foundObjcopy) { $foundObjcopy } else { $foundAr } }

        $mainScript = Get-ChildItem -Recurse -Filter "BUILD-FF-CACHE-MANAGER.ps1" | Select-Object -First 1
        if (-not $mainScript) {
            Write-Error "Could not find BUILD-FF-CACHE-MANAGER.ps1"
            exit 1
        }

        # 4. نسخ الأدوات وملفات الـ DLL المرتبطة لمنع خطأ 0xC0000135
        $possibleToolDirs = @(
            (Join-Path $mainScript.DirectoryName "app\ff_manager\tools"),
            (Join-Path $mainScript.DirectoryName "app\tools"),
            (Join-Path $mainScript.DirectoryName "tools")
        )

        foreach ($dir in $possibleToolDirs) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            
            if ($lipoSrc) {
                Copy-Item $lipoSrc.FullName -Destination (Join-Path $dir "llvm-lipo.exe") -Force
                Get-ChildItem -Path $lipoSrc.DirectoryName -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $dir -Force
            }
            if ($installNameSrc) {
                Copy-Item $installNameSrc.FullName -Destination (Join-Path $dir "llvm-install-name-tool.exe") -Force
                Get-ChildItem -Path $installNameSrc.DirectoryName -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $dir -Force
            }
            $env:PATH = "$dir;$env:PATH"
        }

        # 5. توجيه Clang لقراءة SDK تلقائياً داخل build.ps1
        $innerBuildScript = Get-ChildItem -Recurse -Filter "build.ps1" | Where-Object { $_.DirectoryName -like "*ff_manager*" } | Select-Object -First 1
        if ($innerBuildScript) {
            $content = Get-Content $innerBuildScript.FullName -Raw
            if ($content -notmatch "-isysroot") {
                $content = $content -replace 'clang(\.exe)?', "clang -isysroot `"$sdkPath`""
                Set-Content -Path $innerBuildScript.FullName -Value $content
            }
        }

        # 6. بدء التجميع
        Set-Location $mainScript.DirectoryName
        Write-Host "Executing Build Script in: $($mainScript.DirectoryName)"
        & .\BUILD-FF-CACHE-MANAGER.ps1

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
