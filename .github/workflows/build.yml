name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies & LLVM
      run: |
        python -m pip install --upgrade pip
        pip install lief
        choco install llvm -y

    - name: Prepare Tools & Run Build
      shell: powershell
      run: |
        # 1. تحديد مكان السكربت الرئيسي ومجلد أدوات المشروع المطلوب
        $mainScript = Get-ChildItem -Recurse -Filter "BUILD-FF-CACHE-MANAGER.ps1" | Select-Object -First 1
        if (-not $mainScript) {
            Write-Error "Could not find BUILD-FF-CACHE-MANAGER.ps1"
            exit 1
        }
        $workDir = $mainScript.DirectoryName
        $toolsDir = Join-Path $workDir "app\ff_manager\tools"
        New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

        # 2. البحث عن أدوات LLVM المكتملة الحقيقية من المجلد المصدر
        $llvmBin = "C:\Program Files\LLVM\bin"
        if (-not (Test-Path $llvmBin)) {
            $llvmBin = (Get-ChildItem -Path "C:\" -Filter "clang.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
        }

        # 3. نسخ جميع ملفات التنفيذ (.exe) والـ DLL الحقيقية من LLVM إلى مجلد أدوات المشروع
        if ($llvmBin -and (Test-Path $llvmBin)) {
            Write-Host "Copying real LLVM binaries from: $llvmBin"
            Get-ChildItem -Path $llvmBin -Filter "*.exe" | Copy-Item -Destination $toolsDir -Force
            Get-ChildItem -Path $llvmBin -Filter "*.dll" | Copy-Item -Destination $toolsDir -Force
        }

        # 4. التأكد من وجود أدوات Lipo و Install-Name والربط بالأصلية الحقيقية (مثل llvm-objcopy) إن لم تتواجد صراحة
        $realInstallName = Join-Path $toolsDir "llvm-install-name-tool.exe"
        if (-not (Test-Path $realInstallName)) {
            $objcopy = Join-Path $toolsDir "llvm-objcopy.exe"
            if (Test-Path $objcopy) {
                Copy-Item $objcopy -Destination $realInstallName -Force
            }
        }

        $realLipo = Join-Path $toolsDir "llvm-lipo.exe"
        if (-not (Test-Path $realLipo)) {
            $ar = Join-Path $toolsDir "llvm-ar.exe"
            if (Test-Path $ar) {
                Copy-Item $ar -Destination $realLipo -Force
            }
        }

        # 5. تحديث PATH ليشمل الأدوات أولاً
        $env:PATH = "$toolsDir;$llvmBin;$env:PATH"

        # 6. تشغيل فحص البيئة
        Set-Location $workDir
        $setupScript = Get-ChildItem -Recurse -Filter "SETUP-WINDOWS.ps1" | Select-Object -First 1
        if ($setupScript) {
            Write-Host "Re-checking setup..."
            & $setupScript.FullName -CheckOnly
        }

        # 7. تنفيذ البناء النهائي
        Write-Host "Executing Build Script..."
        & .\BUILD-FF-CACHE-MANAGER.ps1

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
