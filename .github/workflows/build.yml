name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies & LLVM
      run: |
        python -m pip install --upgrade pip
        pip install lief
        choco install llvm -y

    - name: Prepare Tools & Run Build
      shell: powershell
      run: |
        # 1. تحديد مكان السكربت الرئيسي ومجلد الأدوات
        $mainScript = Get-ChildItem -Recurse -Filter "BUILD-FF-CACHE-MANAGER.ps1" | Select-Object -First 1
        if (-not $mainScript) {
            Write-Error "Could not find BUILD-FF-CACHE-MANAGER.ps1"
            exit 1
        }
        $workDir = $mainScript.DirectoryName
        $toolsDir = Join-Path $workDir "app\ff_manager\tools"
        New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

        # 2. نسخ أدوات LLVM
        $llvmBin = "C:\Program Files\LLVM\bin"
        if (Test-Path $llvmBin) {
            Get-ChildItem -Path $llvmBin -Filter "*.exe" | Copy-Item -Destination $toolsDir -Force
            Get-ChildItem -Path $llvmBin -Filter "*.dll" | Copy-Item -Destination $toolsDir -Force
        }

        # 3. التأكد من وجود أدوات Lipo و Install-Name
        $realInstallName = Join-Path $toolsDir "llvm-install-name-tool.exe"
        if (-not (Test-Path $realInstallName)) {
            $objcopy = Join-Path $toolsDir "llvm-objcopy.exe"
            if (Test-Path $objcopy) { Copy-Item $objcopy -Destination $realInstallName -Force }
        }

        $realLipo = Join-Path $toolsDir "llvm-lipo.exe"
        if (-not (Test-Path $realLipo)) {
            $ar = Join-Path $toolsDir "llvm-ar.exe"
            if (Test-Path $ar) { Copy-Item $ar -Destination $realLipo -Force }
        }

        # 4. العثور على iPhoneOS.sdk وتحديد المسارات المباشرة للـ Frameworks و Headers
        $sdkDir = Get-ChildItem -Recurse -Directory -Filter "iPhoneOS.sdk" | Select-Object -First 1
        if (-not $sdkDir) {
            Write-Error "Could not find iPhoneOS.sdk"
            exit 1
        }
        $sdkPath = $sdkDir.FullName
        $frameworksPath = Join-Path $sdkPath "System\Library\Frameworks"
        $includePath = Join-Path $sdkPath "usr\include"
        Write-Host "Using SDK Path: $sdkPath"

        # 5. إجبار المترجم على رؤية الهيدرات عبر متغيرات مسارات العناوين الخاصة بـ GCC/Clang
        $env:CPATH = "$frameworksPath;$includePath"
        $env:C_INCLUDE_PATH = "$frameworksPath;$includePath"
        $env:OBJC_INCLUDE_PATH = "$frameworksPath;$includePath"
        $env:CPLUS_INCLUDE_PATH = "$frameworksPath;$includePath"

        # 6. تحديث PATH
        $env:PATH = "$toolsDir;$llvmBin;$env:PATH"

        # 7. تشغيل السكربت الرئيسي للبناء
        Set-Location $workDir
        Write-Host "Executing Build Script..."
        & .\BUILD-FF-CACHE-MANAGER.ps1 -IosSdk "$sdkPath"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final-Unsigned-IPA
        path: |
          **/release/*.ipa
          **/*.ipa
